[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "sh -c \"if [ \\\"$RAILWAY_SERVICE_NAME\\\" = \\\"lawebcore-workers\\\" ]; then exec arq app.worker.WorkerSettings; else exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers; fi\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/v1/health"

[env]
PYTHONUNBUFFERED = "1"
API_CORS_ORIGINS = '["http://localhost:5173","http://localhost:3000","https://lawebcore.vercel.app"]'
