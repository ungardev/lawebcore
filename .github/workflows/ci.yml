name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app
      # - name: Typecheck
      #   run: mypy app  # TODO: re-enable after fixing 424 strict mypy errors
      - name: Test
        env:
          SUPABASE_JWT_SECRET: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
        run: pytest

  web:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    name: Database migrations check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lawebcore_test
        ports: ['54322:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -p 54322 -U postgres -d lawebcore_test -f "$f"
          done
      - name: Apply seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d lawebcore_test -f supabase/seed.sql
          psql -h localhost -p 54322 -U postgres -d lawebcore_test -f supabase/seed_excel_data.sql