[project]
name = "lawebcore-workers"
version = "0.1.0"
description = "La Web Core - ARQ async workers"
requires-python = ">=3.12"
dependencies = [
    # ARQ worker framework
    "arq>=0.26.3",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "supabase>=2.10.0",
    "gotrue>=2.10.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "fastembed>=0.2.0",
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "python-slugify>=8.0.4",
    "fastapi>=0.115.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "prometheus-client>=0.21.0",
    "slowapi>=0.1.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
