[project]
name = "lawebcore-api"
version = "0.1.0"
description = "La Web Core API - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # App dependencies
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "supabase>=2.10.0",
    "gotrue>=2.10.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "arq>=0.26.3",
    "redis>=5.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "fastembed>=0.2.0",
    "tiktoken>=0.8.0",
    "pgvector>=0.3.6",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "pypdf>=4.0.0",
    "python-slugify>=8.0.4",
    "python-dateutil>=2.9.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "prometheus-client>=0.21.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "ipython>=8.29.0",
    "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "e2e: end-to-end tests requiring real API credentials (Apify + DeepSeek)",
]