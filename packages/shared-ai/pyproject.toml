[project]
name = "shared-ai"
version = "0.1.0"
description = "La Web Core - Shared AI clients (DeepSeek, OpenAI, embeddings)"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "tiktoken>=0.8.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "shared-core @ file:///app/packages/shared-core",
]

[tool.ruff]
line-length = 100
target-version = "py312"
