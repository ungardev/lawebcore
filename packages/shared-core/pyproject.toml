[project]
name = "shared-core"
version = "0.1.0"
description = "La Web Core - Shared core utilities (config, db, supabase)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
